name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # physion/utils/plot_tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: system libraries for Qt (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
               libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
               libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: install physion
        run: pip install -e ".[test]"

      - name: run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
